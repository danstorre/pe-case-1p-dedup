services:
  db:
    image: postgres:16-alpine
    container_name: onep_case_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onep_case
    ports:
      - "55432:5432"
    volumes:
      # Files in docker-entrypoint-initdb.d run in alphabetical order on first start.
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onep_case"]
      interval: 5s
      timeout: 3s
      retries: 10
